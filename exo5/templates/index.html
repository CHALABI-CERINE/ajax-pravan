<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion des Personnes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body onload="init()">


  <label>Nom:</label>
  <input type="text" id="form_nom">
  <label>Prénom:</label>
  <input type="text" id="form_prenom">
  <label>Points:</label>
  <input type="number" id="form_points">

  <button class="btn-add" onclick="doNewData()">Ajouter</button>
  <button class="btn-actualiser" onclick="actualiser()">Actualiser</button>

  <table border="1">
    <tr>
      <th>N°</th>
      <th>Nom</th>
      <th>Prénom</th>
      <th>Points</th>
      <th>Select</th>
    </tr>
  </table>

 <p id="summary">
  <span id="ligne_count">0 ligne(s)</span>
  <span id="total_points">Total point(s)= 0</span>
</p>


</body>
</html>
